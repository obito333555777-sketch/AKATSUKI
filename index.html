<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKATSUKI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #050505;
    color: white;
    min-height: 100vh;
}

/* HOME */

#home {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px;
    background:
        radial-gradient(circle at center, #300000 0%, #090000 35%, #050505 75%);
}

.logo {
    font-size: 55px;
    font-weight: 900;
    letter-spacing: 8px;
    color: #ff2020;
    text-shadow:
        0 0 10px #ff0000,
        0 0 30px #8b0000;
    margin-bottom: 12px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 40px;
    letter-spacing: 3px;
}

.search-box {
    width: 100%;
    max-width: 430px;
    display: flex;
    gap: 10px;
}

.search-box input {
    flex: 1;
    padding: 16px;
    border-radius: 10px;
    border: 1px solid #700000;
    background: #111;
    color: white;
    outline: none;
    font-size: 16px;
}

.search-box input:focus {
    border-color: red;
    box-shadow: 0 0 12px #700000;
}

.search-box button {
    padding: 0 20px;
    border: none;
    border-radius: 10px;
    background: #d00000;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.search-box button:active {
    transform: scale(.95);
}

#error {
    margin-top: 15px;
    color: #ff3333;
    display: none;
}

/* CHAT */

#chat {
    display: none;
    height: 100vh;
    flex-direction: column;
    background: #070707;
}

.chat-header {
    padding: 18px;
    background: #120000;
    border-bottom: 1px solid #700000;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.chat-title {
    color: #ff2020;
    font-weight: bold;
    letter-spacing: 3px;
}

.back {
    background: transparent;
    border: 1px solid #700000;
    color: white;
    padding: 8px 12px;
    border-radius: 7px;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    max-width: 80%;
    margin-bottom: 15px;
    padding: 12px 15px;
    border-radius: 12px;
    background: #181818;
    border-left: 3px solid #d00000;
    word-wrap: break-word;
}

.message.me {
    margin-left: auto;
    background: #350000;
    border-left: none;
    border-right: 3px solid red;
}

.message img {
    max-width: 220px;
    border-radius: 8px;
    margin-top: 8px;
}

.voice {
    width: 220px;
}

.chat-input {
    padding: 12px;
    background: #100000;
    border-top: 1px solid #700000;
    display: flex;
    gap: 7px;
}

.chat-input input {
    min-width: 0;
    flex: 1;
    padding: 13px;
    background: #151515;
    color: white;
    border: 1px solid #500000;
    border-radius: 9px;
    outline: none;
}

.chat-btn {
    width: 45px;
    border: none;
    border-radius: 9px;
    background: #b00000;
    color: white;
    font-size: 20px;
}

.send {
    background: #e00000;
}

/* MOBILE */

@media (max-width: 500px) {
    .logo {
        font-size: 42px;
        letter-spacing: 5px;
    }

    .subtitle {
        font-size: 12px;
    }

    .messages {
        padding: 12px;
    }

    .message {
        max-width: 88%;
    }
}
</style>
</head>

<body>

<!-- HOME PAGE -->

<section id="home">

    <div class="logo">AKATSUKI</div>

    <div class="subtitle">
        PRIVATE CHAT ROOM
    </div>

    <div class="search-box">
        <input
            id="codeInput"
            type="password"
            placeholder="Enter room code..."
        >

        <button onclick="enterRoom()">
            ENTER
        </button>
    </div>

    <div id="error">
        Invalid code
    </div>

</section>


<!-- CHAT ROOM -->

<section id="chat">

    <header class="chat-header">

        <div class="chat-title">
            🔴 AKATSUKI ROOM
        </div>

        <button class="back" onclick="goHome()">
            EXIT
        </button>

    </header>


    <main class="messages" id="messages">

        <div class="message">
            Welcome to the Akatsuki room 🩸
        </div>

    </main>


    <div class="chat-input">

        <!-- IMAGE -->
        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
            onchange="sendImage(event)"
        >

        <button
            class="chat-btn"
            onclick="document.getElementById('imageInput').click()">
            🖼️
        </button>


        <!-- VOICE -->
        <button
            class="chat-btn"
            id="voiceBtn"
            onclick="toggleVoice()">
            🎙️
        </button>


        <!-- TEXT -->
        <input
            id="messageInput"
            type="text"
            placeholder="Type a message..."
            onkeydown="if(event.key==='Enter') sendMessage()"
        >

        <button
            class="chat-btn send"
            onclick="sendMessage()">
            ➤
        </button>

    </div>

</section>


<script>

/* CHANGE YOUR ROOM CODE HERE */

const ROOM_CODE = "AKATSUKI";


/* ENTER ROOM */

function enterRoom() {

    const code =
        document.getElementById("codeInput").value;

    if (code === ROOM_CODE) {

        document.getElementById("home").style.display = "none";

        document.getElementById("chat").style.display = "flex";

        document.getElementById("error").style.display = "none";

    } else {

        document.getElementById("error").style.display = "block";

    }
}


/* EXIT */

function goHome() {

    document.getElementById("chat").style.display = "none";

    document.getElementById("home").style.display = "flex";

    document.getElementById("codeInput").value = "";
}


/* SEND TEXT */

function sendMessage() {

    const input =
        document.getElementById("messageInput");

    const text = input.value.trim();

    if (text === "") return;

    const message =
        document.createElement("div");

    message.className = "message me";

    message.textContent = text;

    document.getElementById("messages")
        .appendChild(message);

    input.value = "";

    scrollMessages();
}


/* SEND IMAGE */

function sendImage(event) {

    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

        const message =
            document.createElement("div");

        message.className = "message me";

        const img =
            document.createElement("img");

        img.src = e.target.result;

        message.appendChild(img);

        document.getElementById("messages")
            .appendChild(message);

        scrollMessages();
    };

    reader.readAsDataURL(file);

    event.target.value = "";
}


/* VOICE RECORDING */

let recorder;
let audioChunks = [];
let recording = false;

async function toggleVoice() {

    if (!recording) {

        try {

            const stream =
                await navigator.mediaDevices
                .getUserMedia({ audio: true });

            recorder = new MediaRecorder(stream);

            audioChunks = [];

            recorder.ondataavailable =
                e => audioChunks.push(e.data);

            recorder.onstop = function() {

                const audioBlob =
                    new Blob(audioChunks,
                    { type: "audio/webm" });

                const audioURL =
                    URL.createObjectURL(audioBlob);

                const message =
                    document.createElement("div");

                message.className = "message me";

                const audio =
                    document.createElement("audio");

                audio.controls = true;
                audio.src = audioURL;
                audio.className = "voice";

                message.appendChild(audio);

                document.getElementById("messages")
                    .appendChild(message);

                scrollMessages();
            };

            recorder.start();

            recording = true;

            document.getElementById("voiceBtn")
                .textContent = "⏹️";

        } catch (error) {

            alert("Microphone permission is required.");

        }

    } else {

        recorder.stop();

        recorder.stream
            .getTracks()
            .forEach(track => track.stop());

        recording = false;

        document.getElementById("voiceBtn")
            .textContent = "🎙️";
    }
}


/* AUTO SCROLL */

function scrollMessages() {

    const box =
        document.getElementById("messages");

    box.scrollTop = box.scrollHeight;
}

</script>

</body>
</html>
